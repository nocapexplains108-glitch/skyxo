<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyxoStore — Premium Digital Gaming Marketplace</title>
<meta name="description" content="A modern digital marketplace for gaming products, games and digital goods.">
<meta property="og:title" content="SkyxoStore — Premium Digital Gaming Marketplace">
<meta property="og:description" content="A modern digital marketplace for gaming products, games and digital goods.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FAFAF8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--white:#fff;--off:#FAFAF8;--lg:#F1F1EF;--grey:#D9D9D6;--black:#111;--mut:#555;--or:#FF5A1F;--ord:#E94B12;
--r-s:12px;--r-m:18px;--r-l:28px;--r-xl:36px;--ease:cubic-bezier(.22,.8,.24,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Manrope,Inter,system-ui,sans-serif;background:var(--off);color:var(--black);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
.wrap{width:min(1320px,100% - 48px);margin:0 auto}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--or);display:flex;align-items:center;gap:8px}
.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--or)}
h1,h2,h3{letter-spacing:-.035em;line-height:1.02}
h2{font-size:clamp(34px,5vw,64px);font-weight:800}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border-radius:999px;font-weight:700;font-size:15px;border:1.5px solid var(--black);background:var(--black);color:#fff;transition:.35s var(--ease);cursor:pointer}
.btn:hover{background:var(--or);border-color:var(--or);transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--black)}.btn.ghost:hover{background:var(--black);border-color:var(--black);color:#fff}
.btn.sm{padding:10px 18px;font-size:13px}
:focus-visible{outline:2px solid var(--or);outline-offset:3px}
/* intro */
.intro{position:fixed;inset:0;z-index:100;background:var(--off);display:grid;place-items:center;animation:out .5s 1.15s forwards;pointer-events:none}
.intro b{font-size:clamp(34px,6vw,64px);font-weight:800;letter-spacing:-.04em;animation:wm .8s var(--ease) both}
.intro b i{font-style:normal;color:var(--or)}
.intro:after{content:"";position:absolute;left:50%;top:calc(50% + 46px);width:56px;height:3px;border-radius:3px;background:var(--or);transform:translateX(-50%) scaleX(0);animation:bar .7s .3s var(--ease) forwards}
@keyframes wm{from{opacity:0;transform:translateY(16px)}}
@keyframes bar{to{transform:translateX(-50%) scaleX(1)}}
@keyframes out{to{opacity:0;visibility:hidden}}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}
@keyframes fade{from{opacity:0}}
/* nav */
.nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;width:min(1320px,100% - 32px);display:flex;justify-content:space-between;align-items:center;padding:10px 10px 10px 24px;border-radius:999px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border:1px solid rgba(0,0,0,.06)}
.logo{font-weight:800;font-size:20px;letter-spacing:-.04em}.logo i{font-style:normal;color:var(--or)}
.nav ul{display:flex;gap:6px;list-style:none}
.nav ul a{padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mut);transition:.25s}
.nav ul a:hover{background:var(--lg);color:var(--black)}
@media(max-width:820px){.nav ul{display:none}}
/* hero */
.hero{position:relative;min-height:max(100svh,660px);background:var(--off);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding:0 24px 88px}
.orbit{position:absolute;inset:0;animation:fade 1.1s .85s both;--cw:150px}
.oc{position:absolute;left:0;top:0;width:var(--cw);aspect-ratio:2/3;border-radius:var(--r-l);overflow:hidden;background:var(--lg);border:1px solid rgba(0,0,0,.07);will-change:transform,opacity;opacity:0}
.oc img,.ph img{width:100%;height:100%;object-fit:cover}
.hero-in{position:relative;z-index:2;text-align:center;max-width:980px;will-change:transform,opacity}
.hero-in>*{animation:rise .9s var(--ease) both}
.hero-in .eyebrow{justify-content:center;margin-bottom:22px;animation-delay:1.05s}
.hero h1{font-size:clamp(46px,8.4vw,128px);font-weight:800;animation-delay:1.15s}
.hero h1 em{font-style:normal;color:var(--or)}
.hero p.lead{max-width:600px;margin:26px auto 34px;font-size:clamp(16px,1.6vw,19px);color:var(--mut);animation-delay:1.3s}
.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation-delay:1.45s}
.hero:before{content:"";position:absolute;inset:auto 0 0;height:55%;background:linear-gradient(to top,var(--off) 30%,transparent);z-index:1}
/* store */
.store{position:relative;z-index:3;background:var(--lg);border-radius:var(--r-xl) var(--r-xl) 0 0;margin-top:-40px;padding:110px 0 120px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:44px}
.sh p{max-width:420px;color:var(--mut)}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:40px}
.tab{padding:12px 22px;border-radius:999px;border:1.5px solid var(--grey);background:transparent;font:700 13px Manrope,sans-serif;letter-spacing:.03em;cursor:pointer;transition:.3s var(--ease);color:var(--black)}
.tab:hover{border-color:var(--black)}.tab[aria-selected=true]{background:var(--black);border-color:var(--black);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:#fff;border:1px solid #E6E6E3;border-radius:var(--r-l);padding:10px;transition:transform .45s var(--ease),border-color .3s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);border-color:var(--grey)}
.ph{position:relative;aspect-ratio:4/5;border-radius:var(--r-m);overflow:hidden;background:var(--lg);display:grid;place-items:center}
.ph img{position:absolute;inset:0;transition:transform .8s var(--ease)}.card:hover .ph img{transform:scale(1.06)}
.fb{padding:20px;text-align:center;font-weight:800;font-size:22px;letter-spacing:-.03em;color:var(--mut)}
.ph.type{background:var(--white);border:1px dashed var(--grey)}.ph.type .fb{font-size:clamp(28px,3vw,44px);color:var(--black)}
.badge{position:absolute;left:12px;top:12px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.92);font-size:12px;font-weight:700;z-index:2}
.cb{padding:16px 10px 8px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{font-size:19px;letter-spacing:-.025em}.cb p{font-size:13px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px}
.pr{font-weight:800;font-size:17px}.pr small{font-size:11px;font-weight:600;color:var(--mut);margin-right:2px}
.card .btn.sm{background:var(--lg);border-color:var(--lg);color:var(--black)}.card:hover .btn.sm{background:var(--black);border-color:var(--black);color:#fff}
.note{margin-top:28px;font-size:12px;color:var(--mut)}
/* sections */
.sec{padding:110px 0}.sec.alt{background:var(--white)}
.sn{display:flex;align-items:baseline;gap:18px;margin-bottom:40px;flex-wrap:wrap}
.sn span{font-weight:800;color:var(--or);font-size:15px}
.rail{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:16px;scrollbar-width:thin}
.rail .card{min-width:280px;flex:0 0 280px;scroll-snap-align:start}
.split{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:20px}
.split .card:first-child .ph{aspect-ratio:auto;height:100%;min-height:420px}
.banner{display:grid;grid-template-columns:1fr 2fr;gap:20px}
.bn{border-radius:var(--r-xl);background:var(--black);color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:space-between;min-height:320px}
.bn h3{font-size:clamp(28px,3vw,42px)}.bn p{color:#bbb;margin-top:14px;font-size:15px}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.lst{border-top:1px solid var(--grey)}
.li{display:grid;grid-template-columns:80px 1fr auto;gap:20px;align-items:center;padding:28px 6px;border-bottom:1px solid var(--grey);transition:padding .4s var(--ease)}
.li:hover{padding-left:20px}.li b{font-size:clamp(22px,3vw,38px);letter-spacing:-.03em}
.li span{color:var(--or);font-weight:800}.li small{color:var(--mut);display:block;font-size:14px;font-weight:500;margin-top:2px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.chip{border-radius:var(--r-l);background:var(--lg);padding:30px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;transition:.4s var(--ease)}
.chip:hover{background:var(--black);color:#fff;transform:translateY(-6px)}
.chip b{font-size:clamp(36px,4vw,56px);letter-spacing:-.04em;line-height:1}.chip small{font-size:13px;opacity:.7}
/* featured */
.feat{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:stretch}
.fv{position:relative;border-radius:var(--r-xl);overflow:hidden;min-height:520px;background:var(--lg)}
.fv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}.fv:hover img{transform:scale(1.04)}
.fi{border-radius:var(--r-xl);background:var(--white);border:1px solid #E6E6E3;padding:44px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.fi h2{font-size:clamp(36px,4.4vw,60px);margin:16px 0}.fi p{color:var(--mut)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.meta span{padding:8px 16px;border-radius:999px;background:var(--lg);font-size:13px;font-weight:700}
/* why / how */
.why{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:1px solid var(--grey)}
.wy{padding:32px 24px 32px 0;border-right:1px solid var(--grey)}.wy:last-child{border:0}.wy+.wy{padding-left:24px}
.wy span{font-size:13px;font-weight:800;color:var(--or)}.wy h3{font-size:22px;margin:40px 0 10px}.wy p{font-size:14px;color:var(--mut)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.st{background:var(--lg);border-radius:var(--r-xl);padding:36px;min-height:340px;display:flex;flex-direction:column;justify-content:space-between}
.st b{font-size:clamp(90px,12vw,170px);line-height:.8;letter-spacing:-.06em;font-weight:800}.st:nth-child(2) b{color:var(--or)}
.st h3{font-size:30px}.st p{color:var(--mut);margin-top:8px;font-size:15px}
.about{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start}
.about p{font-size:clamp(18px,1.9vw,24px);letter-spacing:-.015em;line-height:1.5}.about p+p{margin-top:22px;color:var(--mut);font-size:17px}
/* footer */
footer{background:var(--black);color:#fff;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:90px 0 36px;overflow:hidden}
.fg{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:40px}
.fg p{color:#999;max-width:380px;margin-top:16px;font-size:15px}
.fg h4{font-size:12px;color:var(--or);letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px}
.fg li{list-style:none;margin-bottom:10px}.fg li a{color:#ddd;transition:.2s}.fg li a:hover{color:var(--or)}
.big{font-size:clamp(56px,16vw,240px);font-weight:800;letter-spacing:-.06em;line-height:.85;margin:70px 0 30px;color:#1d1d1d;user-select:none}
.big i{font-style:normal;color:var(--or)}
.copy{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#888;font-size:13px;border-top:1px solid #262626;padding-top:24px}
/* reveal */
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}.rv.in{opacity:1;transform:none}
@media(max-width:1000px){.grid,.grid.c3{grid-template-columns:repeat(2,1fr)}.split,.banner,.feat,.about{grid-template-columns:1fr}.why{grid-template-columns:1fr 1fr}.wy{border:0;border-bottom:1px solid var(--grey);padding-left:0!important}.steps{grid-template-columns:1fr}.chips{grid-template-columns:repeat(2,1fr)}.fv{min-height:380px}.split .card:first-child .ph{min-height:320px}}
@media(max-width:640px){.wrap{width:calc(100% - 32px)}.hero{padding-bottom:56px;min-height:max(100svh,700px)}.orbit{--cw:96px}.oc{border-radius:16px}.grid,.grid.c3{gap:12px}.card{border-radius:22px;padding:8px}.cb h3{font-size:16px}.row{flex-direction:column;align-items:flex-start;gap:10px}.store,.sec{padding:80px 0}.fg{grid-template-columns:1fr 1fr}.fg>div:first-child{grid-column:1/-1}.li{grid-template-columns:44px 1fr}.li .btn{display:none}.fi,.bn,.st{padding:26px}.why{grid-template-columns:1fr}.tabs{flex-wrap:nowrap;overflow-x:auto;margin-right:-16px;padding-right:16px}.tab{white-space:nowrap}.rail .card{min-width:240px;flex-basis:240px}}
/* sub-pages: product / category / payment */
.page{display:none;min-height:100vh;padding:140px 0 100px}
.page.active{display:block}
.crumb{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:32px}
.crumb:hover{color:var(--black)}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
.pd .ph{aspect-ratio:3/4}
.pd-info h1{font-size:clamp(32px,4.4vw,54px);letter-spacing:-.035em;margin-top:14px}
.paycard{max-width:960px;margin:0 auto;display:grid;grid-template-columns:1fr 1.15fr;background:#fff;border-radius:var(--r-xl);overflow:hidden;border:1px solid #E6E6E3}
.pay-l{padding:44px;background:var(--lg)}
.pay-r{padding:44px}
.field{margin-bottom:16px}
.field label{font-size:12px;font-weight:700;display:block;margin-bottom:6px;color:var(--mut)}
.field input{width:100%;padding:14px 16px;border-radius:var(--r-s);border:1.5px solid var(--grey);font:600 15px Manrope,sans-serif;background:#fff;color:var(--black)}
.field input:focus{border-color:var(--black);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.testbadge{display:inline-flex;gap:7px;align-items:center;background:#FFF1EA;color:var(--ord);font-weight:800;font-size:12px;padding:8px 14px;border-radius:999px}
.testbadge:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ord)}
.success{text-align:center;padding:20px 10px}
.success .tick{width:64px;height:64px;border-radius:50%;background:var(--black);display:grid;place-items:center;margin:0 auto 18px;color:#fff;font-size:26px}
@media(max-width:760px){.pd{grid-template-columns:1fr}.paycard{grid-template-columns:1fr}.page{padding:110px 0 70px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}.intro{display:none}}
</style>
</head>
<body>
<div class="intro" aria-hidden="true"><b>Skyxo<i>Store</i></b></div>
<div id="app"></div>

<script>
/* ---------- CONFIG: replace "#" with real routes when they exist ---------- */
const ROUTES={product:'#',contact:'#footer'};
const art=id=>`https://cdn.akamai.steamstatic.com/steam/apps/${id}/library_600x900.jpg`;

/* ---------- DATA (artwork = visual reference only; prices are DEMO placeholders) ---------- */
const CATS=[['steam','Steam'],['pc','PC Games'],['xbox','Xbox'],['playstation','PlayStation'],['roblox','Roblox / Gaming'],['digital','Digital Products'],['domains','Domains']];
const P=[
{t:'Elden Ring',c:'steam',pl:'Steam',m:'Action RPG · Digital key',id:1245620,pr:1499},
{t:'Cyberpunk 2077',c:'steam',pl:'Steam',m:'Open-world RPG · Digital key',id:1091500,pr:1299},
{t:"Baldur's Gate 3",c:'steam',pl:'Steam',m:'Party RPG · Digital key',id:1086940,pr:2499},
{t:'Terraria',c:'steam',pl:'Steam',m:'Sandbox adventure · Digital key',id:105600,pr:349},
{t:'Red Dead Redemption 2',c:'steam',pl:'Steam',m:'Western action · Digital key',id:1174180,pr:1599},
{t:'Grand Theft Auto V',c:'pc',pl:'PC',m:'Open-world action · Digital edition',id:271590,pr:999},
{t:'EA Sports FC 25',c:'pc',pl:'PC',m:'Football · Digital edition',id:2669320,pr:3499},
{t:'Counter-Strike 2',c:'pc',pl:'PC',m:'Competitive FPS · Free to play',id:730,pr:0},
{t:'Forza Horizon 5',c:'xbox',pl:'Xbox / PC',m:'Racing · Digital edition',id:1551360,pr:2999},
{t:'Halo Infinite',c:'xbox',pl:'Xbox / PC',m:'Sci-fi shooter · Campaign',id:1240440,pr:1999},
{t:'Sea of Thieves',c:'xbox',pl:'Xbox / PC',m:'Pirate adventure · Digital edition',id:1172620,pr:1499},
{t:'God of War',c:'playstation',pl:'PlayStation',m:'Action adventure · Digital edition',id:1593500,pr:1999},
{t:"Marvel's Spider-Man",c:'playstation',pl:'PlayStation',m:'Superhero action · Remastered',id:1817070,pr:2999},
{t:'The Last of Us Part I',c:'playstation',pl:'PlayStation',m:'Survival action · Digital edition',id:1888930,pr:2999},
{t:'Horizon Zero Dawn',c:'playstation',pl:'PlayStation',m:'Action RPG · Complete edition',id:1151640,pr:1499},
{t:'Roblox Gift Cards',c:'roblox',pl:'Gaming',m:'Robux top-up · Digital code',pr:499},
{t:'Game Top-ups',c:'roblox',pl:'Gaming',m:'In-game currency · Digital',pr:99},
{t:'Wallet Gift Cards',c:'roblox',pl:'Gaming',m:'Platform credit · Digital code',pr:500},
{t:'Software Licenses',c:'digital',pl:'Digital',m:'Productivity & creative tools',pr:299},
{t:'Subscriptions',c:'digital',pl:'Digital',m:'Gaming & streaming memberships',pr:199}
];
const DOM=[['.com','Global standard'],['.in','Made for India'],['.store','For online shops'],['.gg','For gaming brands']];
const WHY=[['Curated Digital Products','A focused catalogue, chosen with care instead of piled high.'],['Secure Checkout','Payments handled through trusted, encrypted providers.'],['Fast Delivery','Digital goods delivered straight to your inbox.'],['Verified Products','Every listing is checked before it goes live.'],['Support When You Need It','A real person to reach if something looks wrong.']];
const ORBIT=[1245620,1091500,1174180,271590,1551360,105600,1593500,1086940,2669320,730];
const price=p=>p.pr?`₹${p.pr.toLocaleString('en-IN')}`:'Free';

/* ---------- COMPONENTS ---------- */
const $=(s,r=document)=>r.querySelector(s);
const Navbar=()=>`<nav class="nav" aria-label="Main"><a class="logo" href="#top">Skyxo<i>Store</i></a><ul><li><a href="#store">Store</a></li><li><a href="#categories">Categories</a></li><li><a href="#about">About</a></li></ul><a class="btn sm" href="#footer">Contact</a></nav>`;
const Hero=()=>`<header class="hero" id="top"><div class="orbit" id="orbit" aria-hidden="true"></div><div class="hero-in" id="heroIn"><div class="eyebrow">Premium digital marketplace</div><h1>Your next<br>digital <em>world</em><br>starts here.</h1><p class="lead">SkyxoStore is a curated marketplace for games, digital products and gaming-focused services — designed to make buying simple and clear.</p><div class="ctas"><a class="btn" href="#store">Explore Store →</a><a class="btn ghost" href="#categories">View Categories</a></div></div></header>`;
const ProductCard=(p,i=0)=>{const idx=P.indexOf(p);return `<a class="card rv" style="--d:${(i%4)*.07}s" href="#/product/${idx}" aria-label="View ${p.t} details"><div class="ph${p.id?'':' type'}">${p.id?`<img loading="lazy" decoding="async" src="${art(p.id)}" alt="${p.t} cover art (reference image)" onerror="this.remove()">`:''}<span class="fb">${p.id?p.t:p.t.split(' ')[0]}</span><span class="badge">${p.pl}</span></div><div class="cb"><h3>${p.t}</h3><p>${p.m}</p><div class="row"><span class="pr"><small>From</small>${price(p)}</span><span class="btn sm">View</span></div></div></a>`};
const ProductGrid=(list,cls='')=>`<div class="grid ${cls}" id="pg">${list.map(ProductCard).join('')}</div>`;
const CategoryTabs=()=>`<div class="tabs" aria-label="Store categories">${CATS.map((c,i)=>`<a class="tab" href="#/category/${c[0]}" aria-selected="${i==0}">${c[1]}</a>`).join('')}</div>`;
const Store=()=>`<section class="store" id="store"><div class="wrap"><div class="sh rv"><div><div class="eyebrow" style="margin-bottom:16px">The catalogue</div><h2>Explore the store</h2></div><p>Browse by platform and find your next game or digital product. Everything in one calm, clear place.</p></div>${CategoryTabs()}<div id="pgw">${ProductGrid(P.filter(p=>p.c=='steam'))}</div><p class="note">Prices shown are demo placeholders. Cover art is used as visual reference only; all game names and artwork belong to their respective owners.</p></div></section>`;
const by=c=>P.filter(p=>p.c==c);
const Sec=(n,t,body,alt)=>`<section class="sec${alt?' alt':''}" ${n=='01'?'id="categories"':''}><div class="wrap"><div class="sn rv"><span>${n} —</span><h2>${t}</h2></div>${body}</div></section>`;
const Categories=()=>
Sec('01','Steam Games',`<div class="rail rv">${by('steam').map(ProductCard).join('')}</div>`)+
Sec('02','PC Games',`<div class="split">${by('pc').map(ProductCard).join('')}</div>`,1)+

/* ---------- GAME ORBIT (2D curved conveyor, rAF + transforms) ---------- */
(function(){
  const hero=$('#top'),box=$('#orbit'),N=ORBIT.length,SPAN=220,STEP=SPAN/N,SPEED=3.2;
  const els=ORBIT.map(id=>{const d=document.createElement('div');d.className='oc';d.innerHTML=`<img src="${art(id)}" alt="" decoding="async" onerror="this.remove()">`;box.appendChild(d);return d});
  let W,H,t=0,last=0,run=true,raf;
  const size=()=>{W=hero.clientWidth;H=hero.clientHeight};
  function layout(){
    const m=W<700,cx=W/2,cy=m?H*.5:H*1.03,rx=m?W*.85:W*.58,ry=m?H*.5:H*1.1;
    els.forEach((el,i)=>{
      const phi=(i*STEP+t*SPEED)%SPAN,deg=200-phi,rad=deg*Math.PI/180,s=Math.sin(rad);
      const x=cx+rx*Math.cos(rad),y=cy-ry*s,sc=.72+.34*Math.max(0,s);
      el.style.opacity=Math.min(1,phi/14,(SPAN-phi)/14).toFixed(3);
      el.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) translate(-50%,-50%) rotate(${((90-deg)*.5).toFixed(2)}deg) scale(${sc.toFixed(3)})`;
    });
  }
  function tick(now){if(!run)return;t+=Math.min(now-last,50)/1000;last=now;layout();raf=requestAnimationFrame(tick)}
  size();layout();
  addEventListener('resize',()=>{size();layout()});
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){t=30;layout();return}
  const go=()=>{if(!run){run=true;last=performance.now();raf=requestAnimationFrame(tick)}};
  last=performance.now();raf=requestAnimationFrame(tick);
  new IntersectionObserver(e=>{if(e[0].isIntersecting)go();else{run=false;cancelAnimationFrame(raf)}}).observe(hero);
  document.addEventListener('visibilitychange',()=>document.hidden?(run=false,cancelAnimationFrame(raf)):go());
})();

/* ---------- SCROLL: hero → store transition + reveals ---------- */
(function(){
  const hi=$('#heroIn'),orb=$('#orbit'),hero=$('#top');let tick=false;
  addEventListener('scroll',()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{
    const p=Math.min(1,scrollY/hero.clientHeight);
    hi.style.transform=`translate3d(0,${p*70}px,0)`;hi.style.opacity=1-p*1.3;
    orb.style.transform=`translate3d(0,${p*-50}px,0)`;tick=false})},{passive:true});
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  window.observeRv=root=>(root||document).querySelectorAll('.rv:not(.in)').forEach(n=>io.observe(n));
  observeRv();
})();

/* ---------- PRODUCT DETAIL PAGE ---------- */
function productView(i){
  const p=P[i];
  if(!p)return `<div class="wrap"><a class="crumb" href="#store">← Back to store</a><p>Product not found.</p></div>`;
  const cat=CATS.find(c=>c[0]==p.c);const catLabel=cat?cat[1]:p.pl;
  return `<div class="wrap"><a class="crumb" href="#store">← Back to store</a><div class="pd">
    <div class="ph${p.id?'':' type'}">${p.id?`<img loading="lazy" src="${art(p.id)}" alt="${p.t} cover art (reference image)" onerror="this.remove()">`:''}<span class="fb">${p.id?'':p.t.split(' ')[0]}</span><span class="badge">${p.pl}</span></div>
    <div class="pd-info"><div class="eyebrow">${catLabel}</div><h1>${p.t}</h1><p style="color:var(--mut);margin:16px 0;max-width:440px">${p.m}. A demo listing on SkyxoStore — shown for illustration only.</p>
    <div class="meta"><span>${p.pl}</span><span>Digital delivery</span><span>Availability: Demo</span></div>
    <div class="pr" style="font-size:32px;margin:22px 0"><small style="font-size:14px">From</small> ${price(p)}</div>
    <a class="btn" href="#/payment/${i}">Buy now →</a></div>
  </div></div>`;
}
/* ---------- CATEGORY PAGE ---------- */
function categoryView(key){
  const cat=CATS.find(c=>c[0]==key),label=cat?cat[1]:'Category';
  if(key=='domains'){
    return `<div class="wrap"><a class="crumb" href="#store">← Back to store</a><div class="sh"><h2>${label}</h2><p>Register a domain for your store or brand. Pricing shown is a demo placeholder.</p></div><div class="chips">${DOM.map(d=>`<div class="chip"><b>${d[0]}</b><small>${d[1]} · Demo pricing</small></div>`).join('')}</div></div>`;
  }
  const list=P.filter(p=>p.c==key);
  return `<div class="wrap"><a class="crumb" href="#store">← Back to store</a><div class="sh"><h2>${label}</h2><p>${list.length} listing${list.length==1?'':'s'} in ${label}.</p></div>${list.length?ProductGrid(list):'<p style="color:var(--mut)">No listings yet in this category.</p>'}</div>`;
}
/* ---------- DEMO PAYMENT PAGE ---------- */
function paymentView(i){
  const p=P[i];
  return `<div class="wrap"><a class="crumb" href="#store">← Back to store</a><div class="paycard">
    <div class="pay-l"><span class="testbadge">Demo checkout — no real payment</span><h3 style="font-size:24px;margin:16px 0 18px">Order summary</h3>
      ${p?`<div style="display:flex;gap:14px;align-items:center;margin-bottom:18px"><div class="ph${p.id?'':' type'}" style="width:64px;aspect-ratio:2/3;border-radius:10px">${p.id?`<img src="${art(p.id)}" alt="" onerror="this.remove()">`:''}<span class="fb" style="font-size:11px">${p.id?'':p.t.split(' ')[0]}</span></div><div><b style="display:block">${p.t}</b><small style="color:var(--mut)">${p.pl}</small></div></div>`:'<p style="color:var(--mut);margin-bottom:14px">General SkyxoStore order</p>'}
      <div style="display:flex;justify-content:space-between;padding-top:14px;border-top:1px solid var(--grey);font-weight:800;font-size:18px"><span>Total</span><span>${p?price(p):'₹999'}</span></div>
    </div>
    <div class="pay-r">
      <h3 style="font-size:21px;margin-bottom:6px">Card details</h3>
      <p style="color:var(--mut);font-size:13px;margin-bottom:16px">Demo form only — nothing here is sent anywhere or charged.</p>
      <button type="button" class="btn ghost sm" id="fillDemo" style="margin-bottom:18px">Use demo test card</button>
      <form id="payForm">
        <div class="field"><label>Card number</label><input data-role="card" inputmode="numeric" placeholder="4242 4242 4242 4242" required></div>
        <div class="row2"><div class="field"><label>Expiry</label><input data-role="expiry" inputmode="numeric" placeholder="MM/YY" required></div><div class="field"><label>CVC</label><input data-role="cvc" inputmode="numeric" placeholder="123" required></div></div>
        <div class="field"><label>Name on card</label><input data-role="name" placeholder="Test User" required></div>
        <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:6px">Pay ${p?price(p):'₹999'} (demo) →</button>
      </form>
      <div id="paySuccess" class="success" style="display:none"><div class="tick">✓</div><h3 style="font-size:21px">Payment simulated</h3><p style="color:var(--mut);margin-top:8px">This was a demo transaction — no real payment was made or card data stored.</p><a class="btn ghost sm" href="#store" style="margin-top:18px">Back to store</a></div>
    </div>
  </div></div>`;
}
function bindPayForm(){
  const f=$('#payForm');if(!f)return;
  const card=f.querySelector('[data-role=card]'),exp=f.querySelector('[data-role=expiry]'),cvc=f.querySelector('[data-role=cvc]'),name=f.querySelector('[data-role=name]');
  card.addEventListener('input',()=>card.value=card.value.replace(/\D/g,'').slice(0,16).replace(/(.{4})(?=.)/g,'$1 '));
  exp.addEventListener('input',()=>{let v=exp.value.replace(/\D/g,'').slice(0,4);exp.value=v.length>2?v.slice(0,2)+'/'+v.slice(2):v});
  cvc.addEventListener('input',()=>cvc.value=cvc.value.replace(/\D/g,'').slice(0,3));
  $('#fillDemo').addEventListener('click',()=>{card.value='4242 4242 4242 4242';exp.value='12/29';cvc.value='123';name.value='Test User'});
  f.addEventListener('submit',e=>{e.preventDefault();f.style.display='none';$('#fillDemo').style.display='none';$('#paySuccess').style.display='block'});
}
/* ---------- ROUTER ---------- */
function route(){
  const h=location.hash,main=document.querySelector('main'),hero=document.querySelector('.hero');
  const pp=$('#pageProduct'),pc=$('#pageCategory'),pa=$('#pagePayment');
  [pp,pc,pa].forEach(p=>p.classList.remove('active'));
  if(h.startsWith('#/product/')){
    pp.innerHTML=productView(+h.split('/')[2]);pp.classList.add('active');main.style.display='none';hero.style.display='none';scrollTo(0,0);observeRv(pp);
  }else if(h.startsWith('#/category/')){
    pc.innerHTML=categoryView(h.split('/')[2]);pc.classList.add('active');main.style.display='none';hero.style.display='none';scrollTo(0,0);observeRv(pc);
  }else if(h.startsWith('#/payment')){
    const seg=h.split('/')[2];pa.innerHTML=paymentView(seg!==undefined?+seg:-1);pa.classList.add('active');main.style.display='none';hero.style.display='none';scrollTo(0,0);bindPayForm();
  }else{
    main.style.display='';hero.style.display='';
    if(h.length>1){const t=document.querySelector(h);if(t)setTimeout(()=>t.scrollIntoView({behavior:'smooth'}),30)}
  }
}
addEventListener('hashchange',route);route();
</script>
